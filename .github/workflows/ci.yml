name: Pull Request & Main Validation CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Syntax Verification
        run: node --check scripts/*.js scripts/lib/*.js test/*.mjs

      - name: Run Unit & Integration Test Suite
        run: npm test

      - name: Deterministic Pipeline Fixture Validation
        run: npm run sync -- --fixture

      - name: Post-Fixture Verification
        run: npm test
