name: CI

on:
  pull_request:
    branches: [ main, refactor/pipeline-hardening ]
  push:
    branches: [ refactor/pipeline-hardening ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax Check
        run: npm run check:syntax

      - name: Run Test Suite
        run: npm test

      - name: Run Fixture Dry-Run Sync
        run: npm run sync -- --fixture --dry-run --output-dir "$RUNNER_TEMP/sf-fixture-output"

      - name: Re-run Test Suite After Dry-Run
        run: npm test

      - name: Ensure Working Tree Remains Clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
