name: Sync SF Express Locations

on:
  schedule:
    - cron: '7 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Pre-sync Verification Tests
        run: npm test

      - name: Run Data Synchronization Pipeline
        run: npm run sync

      - name: Post-sync Verification Tests
        run: npm test

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ raw/ reports/ README.md package.json package-lock.json
          if git diff --staged --quiet; then
            echo "No location dataset changes today." >> $GITHUB_STEP_SUMMARY
          else
            if [ -f reports/latest-diff.md ]; then
              cat reports/latest-diff.md >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Line Diff Statistics" >> $GITHUB_STEP_SUMMARY
              echo '```stat' >> $GITHUB_STEP_SUMMARY
              git diff --staged --stat >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
            git commit -m "chore: auto-update SF location dataset (HKT)"
            git push origin main
          fi
