name: Sync Locations Data

on:
  schedule:
    # Run daily at 00:00 UTC (08:00 HKT)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax Check
        run: npm run check:syntax

      - name: Run Test Suite
        run: npm test

      - name: Run Fixture Dry-Run Sync
        run: npm run sync -- --fixture --dry-run --output-dir "$RUNNER_TEMP/sf-fixture-output"

      - name: Ensure Working Tree Clean Pre-Live
        run: git diff --exit-code

      - name: Run Live Sync Pipeline
        run: npm run sync

      - name: Post-Live Test Suite (Does not mutate live outputs)
        run: npm test

      - name: Commit and push if dataset updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ raw/ reports/
          if git diff --staged --quiet; then
            echo "No changes in dataset."
          else
            git commit -m "chore(data): daily SF Express HK locations update [skip ci]"
            git push
          fi
